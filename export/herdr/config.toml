onboarding = false

[ui.sound]
enabled = false

[ui]
status_indicators = "symbols"
prompt_new_workspace_name = true

[ui.toast]
delivery = "terminal"

[theme]
name = "terminal"
auto_switch = false

# iTerm2-style Cmd chords, with prefix chords kept for SSH from unconfigured terminals.
# Ghostty must release these chords: see export/ghostty/config.ghostty.
# See https://suraj.io/post/2026/ghostty-as-a-shell-for-herdr/
[keys]
prefix = "ctrl+s"
new_tab   = ["prefix+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+w"]
previous_tab = ["prefix+p", "cmd+shift+[", "cmd+left"]
next_tab     = ["prefix+n", "cmd+shift+]", "cmd+right"]
switch_tab   = ["prefix+1..9", "cmd+1..9"]

new_workspace      = ["prefix+shift+n", "cmd+n"]
close_workspace    = ["prefix+shift+d", "cmd+shift+w"]
previous_workspace = "cmd+shift+up"
next_workspace     = "cmd+shift+down"
switch_workspace   = "cmd+ctrl+1..9"

split_vertical   = ["prefix+v", "cmd+backslash"]
split_horizontal = ["prefix+minus", "cmd+minus"]

focus_pane_left  = ["prefix+h", "cmd+alt+left"]
focus_pane_down  = ["prefix+j", "cmd+alt+down"]
focus_pane_up    = ["prefix+k", "cmd+alt+up"]
focus_pane_right = ["prefix+l", "cmd+alt+right"]
zoom             = ["prefix+z", "cmd+shift+enter"]

previous_agent = "cmd+ctrl+up"
next_agent     = "cmd+ctrl+down"
focus_agent    = "cmd+ctrl+alt+1..9"
goto           = ["prefix+g", "cmd+p"]

[[keys.command]]
key = "cmd+shift+t"
type = "popup"
command = "~/.my/bin/herdr-claude-tab"
description = "new Claude session tab"
width = 70
height = 8
